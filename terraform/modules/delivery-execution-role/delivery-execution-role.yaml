AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ReifnirDeliveryExecution role, assumable only by the GitLab pipeline role in
  Reifnir-Delivery and by Identity Center users signed in to Reifnir-Delivery with the
  AWSAdministratorAccess permission set. Deployed by Terraform
  (delivery-execution-role.tf) as a stack in Reifnir-Root and as a StackSet to every
  other account.

Parameters:
  DeliveryAccountId:
    Type: String
    Description: Account ID of Reifnir-Delivery.
    AllowedPattern: "^[0-9]{12}$"
  DeliveryPipelineRoleName:
    Type: String
    Description: Name of the role GitLab pipelines assume in Reifnir-Delivery with their OIDC ID token.
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"
  DeliveryAdminPermissionSetName:
    Type: String
    Description: Name of the Identity Center permission set whose users in Reifnir-Delivery may assume this role.
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,32}$"

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ReifnirDeliveryExecution
      Description: Deploy role for GitLab pipelines and Identity Center admins in Reifnir-Delivery. Managed by Terraform via CloudFormation.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      # Both statements trust the Delivery account, then narrow to specific roles with
      # aws:PrincipalArn. Naming a role directly as the principal would fail while the
      # role doesn't exist yet, and would silently stop matching if it were recreated.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DeliveryGitLabPipeline
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${DeliveryAccountId}:root"
            Condition:
              StringEquals:
                "aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::${DeliveryAccountId}:role/${DeliveryPipelineRoleName}"
          # Identity Center creates AWSReservedSSO_<permission set>_<random suffix> under
          # the aws-reserved/sso.amazonaws.com/ path (with a region segment when Identity
          # Center isn't in us-east-1), and replaces it if the permission set is
          # reprovisioned, so the suffix and path tail are wildcarded.
          - Sid: DeliveryIdentityCenterAdmins
            Effect: Allow
            Action: sts:AssumeRole
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${DeliveryAccountId}:root"
            Condition:
              StringLike:
                "aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::${DeliveryAccountId}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_${DeliveryAdminPermissionSetName}_*"

Outputs:
  RoleArn:
    Value: !GetAtt Role.Arn
